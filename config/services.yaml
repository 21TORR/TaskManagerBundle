services:
    _defaults:
        autoconfigure: true
        autowire: true

    Torr\TaskManager\:
        resource: ../src/*
        exclude:
            - ../src/Entity/*
            - ../src/Event/*
            - ../src/Exception/*
            - ../src/Task/Task.php
            - ../src/Task/TaskMetaDataf.php
            - ../src/TaskManagerBundle.php

    Torr\TaskManager\Transport\TransportsHelper:
        $transports: '@messenger.receiver_locator'
